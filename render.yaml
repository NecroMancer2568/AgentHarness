services:
  # 1. Backend: FastAPI multi-agent orchestrator
  - type: web
    name: agentharness-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: 180
      - key: OPENROUTER_MAX_RETRIES
        value: 2
      - key: OPENROUTER_TITLE
        value: AgentHarness Lab
      # No disk on free plan -> paths now live on ephemeral storage
      - key: AGENTHARNESS_DATABASE
        value: /app/workspace/agentharness.sqlite3
      - key: AGENTHARNESS_REPOS_ROOT
        value: /app/workspace/repositories
      - key: AGENTHARNESS_RUNS_ROOT
        value: /app/workspace/runs
      - key: AGENTHARNESS_VENV_CACHE_ROOT
        value: /app/workspace/venvs
      - key: AGENTHARNESS_CORS_ORIGINS
        value: "*"

  # 2. Frontend: React SPA + Nginx reverse proxy
  - type: web
    name: agentharness-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: agentharness-backend
          property: hostport