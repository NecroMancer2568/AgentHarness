# ==============================================================================
# AgentHarness Lab — Docker Compose Local Development Stack (OpenRouter)
# ==============================================================================
# Start complete stack:       docker compose up --build
# Start in background:         docker compose up -d --build
# Stop stack:                  docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend: React + Vite production build served via Nginx with API reverse proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agentharness-frontend:latest
    container_name: agentharness-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      PORT: "80"
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentharness-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Backend: FastAPI multi-agent execution orchestrator & tools runtime
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agentharness-backend:latest
    container_name: agentharness-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      OPENROUTER_TIMEOUT_SECONDS: "${OPENROUTER_TIMEOUT_SECONDS:-180}"
      OPENROUTER_MAX_RETRIES: "${OPENROUTER_MAX_RETRIES:-2}"
      OPENROUTER_HTTP_REFERER: "${OPENROUTER_HTTP_REFERER:-}"
      OPENROUTER_TITLE: "${OPENROUTER_TITLE:-AgentHarness Lab}"
      AGENTHARNESS_CORS_ORIGINS: "${AGENTHARNESS_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}"
      AGENTHARNESS_DATABASE: "/app/workspace/agentharness.sqlite3"
      AGENTHARNESS_REPOS_ROOT: "/app/workspace/repositories"
      AGENTHARNESS_RUNS_ROOT: "/app/workspace/runs"
      AGENTHARNESS_VENV_CACHE_ROOT: "/app/workspace/venvs"
      AGENTHARNESS_MAX_AGENT_STEPS: "${AGENTHARNESS_MAX_AGENT_STEPS:-8}"
      AGENTHARNESS_MAX_PARALLEL_READERS: "${AGENTHARNESS_MAX_PARALLEL_READERS:-2}"
      AGENTHARNESS_TEST_TIMEOUT_SECONDS: "${AGENTHARNESS_TEST_TIMEOUT_SECONDS:-180}"
      AGENTHARNESS_DEPENDENCY_TIMEOUT_SECONDS: "${AGENTHARNESS_DEPENDENCY_TIMEOUT_SECONDS:-1800}"
      AGENTHARNESS_PIP_CACHE_DIR: "/app/workspace/pip_cache"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/app/workspace
    networks:
      - agentharness-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  agentharness-net:
    name: agentharness-net
    driver: bridge
